[project]
name = "brain-tumor-agent"
version = "0.1.0"
description = "Multimodal MRI brain tumor segmentation and RAG-assisted clinical demo."
requires-python = ">=3.11,<3.13"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = [
    "backend/tests",
    "data_process/tests",
    "segmentation/tests",
    "feature_extract/tests",
    "report/tests",
    "rag/tests",
    "agent/tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
