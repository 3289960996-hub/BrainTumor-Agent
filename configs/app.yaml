# 设计参考文档：代码不会读取本文件。
# 实际生效的配置来自环境变量与项目根目录的 .env（字段定义见
# backend/app/core/config.py 的 Settings），本文件只用于记录非敏感默认值的口径。
# 与代码默认值重叠的键由 backend/tests/test_config_consistency.py 守护，避免漂移。
application:
  name: BrainTumor-Agent
  version: 0.1.0
  environment: development
  api_prefix: /api/v1

storage:
  data_root: ./runtime/data
  model_root: ./runtime/models
  faiss_index_path: ./runtime/faiss
  max_upload_size_mb: 1024

segmentation:
  engine: nnunetv2
  dataset_id: 137
  configuration: 3d_fullres
  plans: nnUNetResEncUNetMPlans
  trainer: nnUNetTrainer
  folds:
    - "0"
    - "1"
    - "2"
    - "3"
    - "4"
  device: cuda
  gpu_id: "0"
  checkpoint: checkpoint_final.pth
  enabled: true
  required_modalities:
    - t1
    - t1ce
    - t2
    - flair

rag:
  vector_store: faiss
  embedding_model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  chunk_size: 900
  chunk_overlap: 150
  top_k: 5
  enabled: true

agent:
  provider: dashscope
  model: qwen-plus
  temperature: 0.1
  max_tokens: 1000
  allowed_tools:
    - mri_analyzer
    - report_generator
    - medical_rag
  require_human_review: true
  enabled: true

report:
  model: qwen-plus
  temperature: 0.2
  max_tokens: 800
  require_human_review: true
