version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s | %(levelname)s | %(name)s | %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    formatter: standard
    level: INFO

  application_file:
    class: logging.handlers.RotatingFileHandler
    formatter: standard
    level: INFO
    filename: logs/brain_tumor_agent.log
    maxBytes: 10485760
    backupCount: 5
    encoding: utf-8

  audit_file:
    class: logging.handlers.RotatingFileHandler
    formatter: standard
    level: INFO
    filename: logs/brain_tumor_agent-audit.log
    maxBytes: 10485760
    backupCount: 10
    encoding: utf-8

root:
  handlers:
    - console
    - application_file
  level: INFO

loggers:
  # 审计事件单独留档，不随进程重启丢失，便于回溯谁在什么时候访问了哪个病例。
  brain_tumor_agent.audit:
    handlers:
      - console
      - audit_file
    level: INFO
    propagate: false
